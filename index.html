<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Yogi &amp; Shinta | HITA PHOTOBOOTH</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f7f7f5;
      color: #191919;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      min-height: min(740px, calc(100vh - 48px));
      min-height: min(740px, calc(100svh - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 36px;
      border: 1px solid #e5e5e2;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(0 0 0 / 5%);
      text-align: center;
    }
    .brand {
      margin: 0;
      display: block;
      width: 112px;
      max-width: 100%;
      height: auto;
    }
    .content { width: 100%; margin-block: auto; padding-block: 72px 88px; }
    h1 {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.055em;
      overflow-wrap: anywhere;
    }
    .date { margin: 14px 0 0; color: #626262; font-size: 14px; line-height: 1.6; }
    .downloads { display: grid; gap: 22px; margin-top: 44px; }
    a { -webkit-tap-highlight-color: transparent; }
    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 18px 24px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      box-shadow: 4px 6px 0 #e5e5e5;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.18em;
      text-decoration: none;
    }
    .socials { display: flex; justify-content: center; gap: 18px; margin-top: 34px; }
    .social {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: #111;
    }
    .social svg { display: block; width: 25px; height: 25px; }
    a:focus-visible { outline: 3px solid #666; outline-offset: 6px; }
    a[aria-disabled="true"] { cursor: not-allowed; }
    @media (hover: hover) {
      .download[href]:hover { background: #303030; }
      .social[href]:hover { background: #f1f1ef; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card {
        min-height: calc(100vh - 32px);
        min-height: calc(100svh - 32px);
        padding: 36px 28px;
        border-radius: 24px;
      }
      .content { padding-block: 56px 72px; }
    }
    @media (max-height: 650px) {
      .card { padding-block: 28px; }
      .content { padding-block: 40px; }
      .downloads { margin-top: 32px; }
      .socials { margin-top: 26px; }
    }
  </style>
</head>

  <script>
    // KONFIGURASI URL — PHOTO dan GIF sudah diisi.
    // TODO: isi URL Instagram dan WhatsApp di bawah ini.
    // Gunakan URL lengkap https://... dan pertahankan tanda kutip.
    // PHOTO/GIF: gunakan link berbagi file/folder dengan izin pengunjung yang sesuai.
    const LINKS = {
      photo: "https://drive.google.com/drive/folders/1XeIrBIOwi_dnpdHQ3nZ1LIsPS9Fo-o6y?usp=sharing",
      gif: "https://drive.google.com/drive/folders/11EBRckj30ZYfpq1bIRrnPA_4PiD2z6I5?usp=sharing",
      instagram: "[MASUKKAN_LINK_INSTAGRAM_HITA]",
      whatsapp: "[MASUKKAN_LINK_WHATSAPP_HITA]"
    };

    // JavaScript kecil ini menghubungkan konfigurasi ke tautan.
    // Placeholder atau URL tidak valid tetap nonaktif, tanpa tujuan pengganti.
    const labels = { photo: "PHOTO", gif: "GIF", instagram: "Instagram HITA PHOTOBOOTH", whatsapp: "WhatsApp HITA PHOTOBOOTH" };
    document.querySelectorAll("[data-link]").forEach((link) => {
      const key = link.dataset.link;
      try {
        const url = new URL(LINKS[key]);
        if (url.protocol !== "https:") return;
        link.href = url.href;
        link.removeAttribute("aria-disabled");
        link.setAttribute("aria-label", labels[key] + " — buka di tab baru");
      } catch {
        // TODO: isi URL di LINKS untuk mengaktifkan tautan ini.
      }
      if (!link.hasAttribute("href")) {
        link.title = "Tautan belum tersedia";
      }
    });
